<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="t d">
  <title id="t">How Aiana works</title>
  <desc id="d">A watcher and Claude Code hooks capture each conversation; an embedder turns it into vectors; storage fans out to SQLite with FTS5, Qdrant for vectors, Redis for cache and mem0 for graph memory. Nine MCP tools and a context injector read it back into Claude Code.</desc>
  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#e6ebf5; }
    .muted { fill:#8b96ad; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes f1 { 0%,4.00% { offset-distance:0%; opacity:0 } 5.00% { opacity:1 } 15.00% { offset-distance:100%; opacity:1 } 16.50%,100% { opacity:0 } } .f1 { animation:f1 10.0s infinite; offset-path: path('M250 150 L 330 150'); }
    @keyframes f2 { 0%,16.00% { offset-distance:0%; opacity:0 } 17.00% { opacity:1 } 27.00% { offset-distance:100%; opacity:1 } 28.50%,100% { opacity:0 } } .f2 { animation:f2 10.0s infinite; offset-path: path('M470 150 L 540 150'); }
    @keyframes f30 { 0%,28.00% { offset-distance:0%; opacity:0 } 29.00% { opacity:1 } 39.00% { offset-distance:100%; opacity:1 } 40.50%,100% { opacity:0 } } .f30 { animation:f30 10.0s infinite; offset-path: path('M690 150 L 760 110'); }
    @keyframes f31 { 0%,29.50% { offset-distance:0%; opacity:0 } 30.50% { opacity:1 } 40.50% { offset-distance:100%; opacity:1 } 42.00%,100% { opacity:0 } } .f31 { animation:f31 10.0s infinite; offset-path: path('M690 150 L 760 150'); }
    @keyframes f32 { 0%,31.00% { offset-distance:0%; opacity:0 } 32.00% { opacity:1 } 42.00% { offset-distance:100%; opacity:1 } 43.50%,100% { opacity:0 } } .f32 { animation:f32 10.0s infinite; offset-path: path('M690 150 L 760 190'); }
    @keyframes f33 { 0%,32.50% { offset-distance:0%; opacity:0 } 33.50% { opacity:1 } 43.50% { offset-distance:100%; opacity:1 } 45.00%,100% { opacity:0 } } .f33 { animation:f33 10.0s infinite; offset-path: path('M690 150 L 760 230'); }
    @keyframes f4 { 0%,46.00% { offset-distance:0%; opacity:0 } 47.00% { opacity:1 } 57.00% { offset-distance:100%; opacity:1 } 58.50%,100% { opacity:0 } } .f4 { animation:f4 10.0s infinite; offset-path: path('M520 270 L 520 320'); }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
  </style>
  <rect width="960" height="430" rx="20" fill="#0f1420"/>
  <text x="30" y="52" font-size="28" font-weight="800">How it works</text>
  <text x="30" y="78" font-size="15" class="muted">Capture every conversation, embed it, store it four ways, and read it back through 9 MCP tools.</text>

  <rect x="60" y="120" width="190" height="60" rx="12" fill="#161d2b" stroke="#b58cff" stroke-width="2"/><text x="155.0" y="148.0" text-anchor="middle" font-size="13" font-weight="700">Watcher + hooks</text><text x="155.0" y="166.0" text-anchor="middle" font-size="10" class="muted">Claude Code sessions</text>
  <rect x="330" y="120" width="140" height="60" rx="12" fill="#161d2b" stroke="#7c6cff" stroke-width="2"/><text x="400.0" y="148.0" text-anchor="middle" font-size="13" font-weight="700">Embedder</text><text x="400.0" y="166.0" text-anchor="middle" font-size="10" class="muted">sentence-transformers</text>
  <rect x="540" y="120" width="150" height="60" rx="12" fill="#161d2b" stroke="#3ec7ff" stroke-width="2"/><text x="615.0" y="148.0" text-anchor="middle" font-size="13" font-weight="700">Storage</text><text x="615.0" y="166.0" text-anchor="middle" font-size="10" class="muted">fan-out</text>
  <line x1="250" y1="150" x2="330" y2="150" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <line x1="470" y1="150" x2="540" y2="150" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <circle class="f1" r="5" fill="#b58cff"/><circle class="f2" r="5" fill="#7c6cff"/>
  <rect x="760" y="95" width="150" height="30" rx="8" fill="#1d2536" stroke="#3ec7ff" stroke-opacity=".5"/><text x="772" y="114" font-size="11.5" font-weight="600">SQLite + FTS5</text><text x="900" y="114" text-anchor="end" font-size="9" class="muted">full-text</text><rect x="760" y="135" width="150" height="30" rx="8" fill="#1d2536" stroke="#3ec7ff" stroke-opacity=".5"/><text x="772" y="154" font-size="11.5" font-weight="600">Qdrant</text><text x="900" y="154" text-anchor="end" font-size="9" class="muted">vectors</text><rect x="760" y="175" width="150" height="30" rx="8" fill="#1d2536" stroke="#3ec7ff" stroke-opacity=".5"/><text x="772" y="194" font-size="11.5" font-weight="600">Redis</text><text x="900" y="194" text-anchor="end" font-size="9" class="muted">cache</text><rect x="760" y="215" width="150" height="30" rx="8" fill="#1d2536" stroke="#3ec7ff" stroke-opacity=".5"/><text x="772" y="234" font-size="11.5" font-weight="600">mem0</text><text x="900" y="234" text-anchor="end" font-size="9" class="muted">graph memory</text>
  <circle class="f30" r="4" fill="#3ec7ff"/><circle class="f31" r="4" fill="#3ec7ff"/><circle class="f32" r="4" fill="#3ec7ff"/><circle class="f33" r="4" fill="#3ec7ff"/>

  <rect x="30" y="300" width="610" height="104" rx="12" fill="#1a1530" stroke="#b58cff" stroke-opacity=".5"/>
  <text x="46" y="322" font-size="12" font-weight="700" class="muted" letter-spacing=".08em">9 MCP TOOLS + CONTEXT INJECTOR → BACK INTO CLAUDE CODE</text>
  <text x="40" y="330" font-size="11" class="mono" style="fill:#c9a9ff">memory_search</text><text x="250" y="330" font-size="11" class="mono" style="fill:#c9a9ff">memory_add</text><text x="460" y="330" font-size="11" class="mono" style="fill:#c9a9ff">memory_recall</text><text x="40" y="356" font-size="11" class="mono" style="fill:#c9a9ff">session_list</text><text x="250" y="356" font-size="11" class="mono" style="fill:#c9a9ff">session_show</text><text x="460" y="356" font-size="11" class="mono" style="fill:#c9a9ff">preference_add</text><text x="40" y="382" font-size="11" class="mono" style="fill:#c9a9ff">aiana_status</text><text x="250" y="382" font-size="11" class="mono" style="fill:#c9a9ff">memory_feedback</text><text x="460" y="382" font-size="11" class="mono" style="fill:#c9a9ff">feedback_summary</text>
  <line x1="520" y1="180" x2="520" y2="300" stroke="#2c3750" stroke-width="2" stroke-dasharray="3 5"/>
  <circle class="f4" r="5" fill="#c9a9ff"/>
  <text x="820" y="300" text-anchor="middle" font-size="11" class="muted">four backends,</text>
  <text x="820" y="318" text-anchor="middle" font-size="11" class="muted">each feature-detected</text>
</svg>
